[platformio]
default_envs = oracle-adv

[env:oracle-adv]
platform = espressif32@7.1.3
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11 -fexceptions
build_flags =
    -std=gnu++17
    -fno-exceptions
    -Wl,--wrap=esp_wifi_init
    -fmerge-all-constants
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DMYNEWT_VAL_BLE_STORE_CONFIG_PERSIST=0
build_src_filter = +<*> -<sim/>
extra_scripts =
    pre:../tools/optimize_firmware.py
    pre:../tools/nimble_m5apps.py
    post:../tools/check_size.py
lib_deps =
    m5stack/M5Unified@0.2.25
    https://github.com/m5stack/M5GFX.git#0.2.32
    https://github.com/m5stack/M5Cardputer.git#1.2.0
    z3t0/IRremote@4.7.1
    bblanchon/ArduinoJson@7.4.3
    h2zero/NimBLE-Arduino@1.4.3

[env:oracle-adv-ru]
extends = env:oracle-adv
build_flags =
    ${env:oracle-adv.build_flags}
    -DORACLE_LANG_RU=1

[env:oracle-adv-zh]
extends = env:oracle-adv
build_flags =
    ${env:oracle-adv.build_flags}
    -DORACLE_LANG_ZH=1

[env:native-sim]
platform = native
build_type = debug
lib_deps =
    https://github.com/m5stack/M5GFX.git#0.2.32
    bblanchon/ArduinoJson@7.4.3
build_src_filter = -<*> +<core.cpp> +<chinese_font.cpp> +<draw.cpp> +<tarot.cpp> +<tarot_api.cpp> +<tarot_receipt.cpp> +<print_protocol.cpp> +<sim/main.cpp>
build_flags =
    -std=c++17
    -DORACLE_SIM
    -DM5GFX_BOARD=board_M5Cardputer
    -DM5GFX_SCALE=4
    !sdl2-config --cflags
    !sdl2-config --libs

[env:native-sim-ru]
extends = env:native-sim
build_flags =
    ${env:native-sim.build_flags}
    -DORACLE_LANG_RU=1

[env:native-sim-zh]
extends = env:native-sim
build_flags =
    ${env:native-sim.build_flags}
    -DORACLE_LANG_ZH=1

