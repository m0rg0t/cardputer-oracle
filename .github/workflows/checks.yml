name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tools -p test_pack.py
      - run: python -m unittest discover -s tools -p test_repo_guard.py
      - run: python tools/run_native_tests.py
      - run: python tools/build_site.py
      - run: python tools/check_repo.py --site
